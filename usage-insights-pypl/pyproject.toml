[project]
name = "usage-insights-pypl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcos LM", email = "marcoslm@ciencias.unam.mx" }
]
requires-python = ">=3.14"
dependencies = [
    "db-dtypes>=1.7.1",
    "duckdb>=1.5.5",
    "fire>=0.7.1",
    "google-cloud-bigquery[all]>=3.44.0",
    "google-cloud-bigquery-storage>=2.41.0",
    "loguru>=0.7.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
]

[project.scripts]
usage-insights-pypl = "usage_insights_pypl:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
